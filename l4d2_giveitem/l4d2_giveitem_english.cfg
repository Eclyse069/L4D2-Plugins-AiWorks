// ---------------------------------------------------------------------------
// L4D2 Item Give v1.0 - config template (mirrors the Chinese cfg values)
// Copy to: <platform>\left4dead2\cfg\sourcemod\l4d2_giveitem.cfg
// This ASCII version is the fallback for the known L4D2 non-ASCII cfg issue.
//
// Usage: hold one of medkit / defib / incendiary pack / explosive pack /
// molotov / pipe bomb / bile jar, aim at a living teammate within 150 units
// and press R once to hand it over. Vanilla pills right-click give is not
// affected; primary/secondary weapon reload is not affected.
//
// IMPORTANT: do not run this together with l4d_gear_transfer - both intercept
// the R key hand-off. The game instructor hint needs the client instructor
// enabled; the chat notice works regardless.
// ---------------------------------------------------------------------------

// Master switch: 0 disables handing items with R, 1 enables the plugin
l4d2_giveitem_enable "1"

// Maximum distance (units) to hand an item to a teammate
l4d2_giveitem_range "150.0"

// Per player give cooldown in seconds
l4d2_giveitem_cooldown "0.5"

// Broadcast the hand-off in chat (0/1)
l4d2_giveitem_chat "1"

// Show the game instructor hint to the giver and the receiver (0/1)
l4d2_giveitem_hint "1"

// Instructor hint timeout in seconds
l4d2_giveitem_hinttime "5.0"

// Instructor hint colour (R G B)
l4d2_giveitem_hintcolour "255 255 255"

// Trigger the game talker (vocalize PlayerAlertGiveItem) on the giver, with subtitles and lip sync (0/1)
l4d2_giveitem_voice "1"

// Play the vanilla reward sounds: bigreward.wav to the giver and littlereward.wav to the receiver (0/1)
l4d2_giveitem_sound "1"

// Allow handing the medkit (0/1)
l4d2_giveitem_allow_medkit "1"

// Allow handing the defibrillator (0/1)
l4d2_giveitem_allow_defib "1"

// Allow handing the incendiary ammo pack (0/1)
l4d2_giveitem_allow_incendiary "1"

// Allow handing the explosive ammo pack (0/1)
l4d2_giveitem_allow_explosive "1"

// Allow handing the molotov (0/1)
l4d2_giveitem_allow_molotov "1"

// Allow handing the pipe bomb (0/1)
l4d2_giveitem_allow_pipebomb "1"

// Allow handing the bile jar (0/1)
l4d2_giveitem_allow_bile "1"
