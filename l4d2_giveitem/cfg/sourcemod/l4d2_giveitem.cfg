// ===========================================================================
// L4D2 Item Give v1.0 —— R键递物插件
// 配置文件：cfg/sourcemod/l4d2_giveitem.cfg
// 所有数值均为默认值；改完保存后换图生效，也可用 sm_cvar 即时修改。
//
// 用法：手持下列物品、准星对着 150 单位内的存活队友、单击 R 键即递给对方：
//       医疗包、电击器、燃烧弹药箱、高爆弹药箱、燃烧瓶、土制炸弹、胆汁罐
//       （原版止痛药右键递给不受影响；主/副武器 R 换弹不受影响）
// 提示：全场聊天 "\x04[提示]XX递给了XX一个XX"；双方屏幕出现原版教练提示框。
//
// 【重要】不要与 l4d_gear_transfer（投掷医疗包按R给队友）同时启用，
// 两者都拦截 R 键递物，会重复触发/判断混乱。二选一即可。
// 教练提示框受客户端「教学提示」开关影响：客户端关闭教学提示则看不到
// 提示框（聊天提示不受影响）。
//
// 【中文注释说明】L4D2 自带的 cfg 解析器对非 ASCII 字符支持不佳，
// 个别环境下中文注释会在控制台刷 unknown command。如果遇到：
//   1) 启用 JS-MODS 里的「可选-修复类(修复CFG中文注释导致控制台刷屏的问题)」；或
//   2) 用英文备用文件 l4d2_giveitem_english.cfg 覆盖本文件。
// ===========================================================================


// ---------------------------------------------------------------------------
// 一、总开关与提示
// ---------------------------------------------------------------------------

// 总开关：0 = 关闭插件；1 = 开启
l4d2_giveitem_enable "1"

// 递物最大距离（游戏单位）；准星队友超出此距离不会有反应
l4d2_giveitem_range "150.0"

// 同一玩家两次递物之间的冷却秒数（防连按刷屏）
l4d2_giveitem_cooldown "0.5"

// 全场聊天提示：1 = "\x04[提示]XX 递给了 XX 一个 XX"；0 = 关闭
l4d2_giveitem_chat "1"

// 原版教练提示框（env_instructor_hint）：1 = 递/接双方各弹一条；0 = 关闭
l4d2_giveitem_hint "1"

// 教练提示框停留秒数
l4d2_giveitem_hinttime "5.0"

// 教练提示框颜色（R G B）
l4d2_giveitem_hintcolour "255 255 255"

// 递物成功时触发游戏自带 talker 台词（"给你，拿着"，vocalize PlayerAlertGiveItem，
// 与语音轮盘同路径：按角色挑台词、带字幕和口型同步）：1=开；0=静音
l4d2_giveitem_voice "1"

// 原版系统音效：给予者播放 ui/bigreward.wav、被给予者播放 ui/littlereward.wav：1=开；0=静音
l4d2_giveitem_sound "1"


// ---------------------------------------------------------------------------
// 二、各物品开关（1=允许递给队友；0=禁止）
// ---------------------------------------------------------------------------

// 医疗包
l4d2_giveitem_allow_medkit "1"

// 电击器
l4d2_giveitem_allow_defib "1"

// 燃烧弹药箱
l4d2_giveitem_allow_incendiary "1"

// 高爆弹药箱
l4d2_giveitem_allow_explosive "1"

// 燃烧瓶
l4d2_giveitem_allow_molotov "1"

// 土制炸弹
l4d2_giveitem_allow_pipebomb "1"

// 胆汁罐
l4d2_giveitem_allow_bile "1"


// ---------------------------------------------------------------------------
// 三、常用示例（需要时去掉行首的 // 即可）
// ---------------------------------------------------------------------------
//
// 只允许递医疗包和电击器（禁投掷物和弹药箱）：
// l4d2_giveitem_allow_molotov "0"
// l4d2_giveitem_allow_pipebomb "0"
// l4d2_giveitem_allow_bile "0"
// l4d2_giveitem_allow_incendiary "0"
// l4d2_giveitem_allow_explosive "0"
//
// 只保留聊天提示、不弹教练提示框：
// l4d2_giveitem_hint "0"
//
// 把递物距离放宽到 300：
// l4d2_giveitem_range "300.0"
//
// ===========================================================================
