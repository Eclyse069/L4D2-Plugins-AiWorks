"NekoServerNameRotator"
{
	"Settings"
	{
		"mode"		"time"
		"interval"	"300"
		"timezone"	"8"
		"reloadcmd"	"sm plugins reload NekoServerName"
	}
	"TimePeriods"
	{
		"凌晨"	{ "start" "0"	"file" "nekocustom_01.cfg" }
		"早上"	{ "start" "6"	"file" "nekocustom_02.cfg" }
		"下午"	{ "start" "12"	"file" "nekocustom_03.cfg" }
		"夜晚"	{ "start" "18"	"file" "nekocustom_04.cfg" }
		"深夜"	{ "start" "22"	"file" "nekocustom_05.cfg" }
	}
}
